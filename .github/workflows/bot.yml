name: Bot de trading (paper)

# Horarios en UTC (Argentina = UTC-3).
on:
  schedule:
    # Operaciones cada 25 min, lunes a viernes, de 10:30 a 18:00 (hora argentina).
    - cron: "30 13,18 * * 1-5"
    - cron: "55 13,18 * * 1-5"
    - cron: "20 14,19 * * 1-5"
    - cron: "45 14,19 * * 1-5"
    - cron: "10 15,20 * * 1-5"
    - cron: "35 15,20 * * 1-5"
    - cron: "0 16,21 * * 1-5"
    - cron: "25 16 * * 1-5"
    - cron: "50 16 * * 1-5"
    - cron: "15 17 * * 1-5"
    - cron: "40 17 * * 1-5"
    - cron: "5 18 * * 1-5"
    # Resumen del día: 22:00 hora argentina, de lunes a viernes.
    - cron: "0 1 * * 2-6"
    # Reporte semanal: domingos 20:00 hora argentina.
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      comando:
        description: "Qué ejecutar"
        type: choice
        options: [ciclo, resumen, reporte, ccl, cotizacion, cartera]
        default: ciclo
      simbolo:
        description: "Símbolo (solo para cotizacion), ej: GGAL.BA, NVDA, BTC"
        required: false
        default: ""
      canal:
        description: "Canal de respuesta (vacío = todos; telegram = solo Telegram)"
        required: false
        default: ""

permissions:
  contents: write

# Los ciclos que modifican la cartera van en fila; las consultas corren aparte y no esperan.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.comando != 'ciclo') && format('consulta-{0}', github.run_id) || 'trading-bot' }}
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Argentina/Buenos_Aires
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NOTIFY_CHANNELS: ${{ inputs.canal || vars.NOTIFY_CHANNELS || 'telegram,whatsapp' }}
      CMD_INPUT: ${{ inputs.comando }}
      SIMBOLO: ${{ inputs.simbolo }}
      EVENTO: ${{ github.event_name }}
      CRON: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot
        run: |
          CMD="$CMD_INPUT"
          if [ "$EVENTO" = "schedule" ]; then
            case "$CRON" in
              "0 1 * * 2-6") CMD=resumen ;;
              "0 23 * * 0")  CMD=reporte ;;
              *)             CMD=ciclo ;;
            esac
          fi
          echo "Comando: $CMD | Canales: $NOTIFY_CHANNELS"
          case "$CMD" in
            resumen)    python -m bot.main resumen-dia ;;
            reporte)    python -m bot.main reporte ;;
            ccl)        python -m bot.main ccl --enviar ;;
            cotizacion) python -m bot.main cotizacion "$SIMBOLO" ;;
            cartera)    python -m bot.main cartera ;;
            *)          python -m bot.main run --mode paper --solo-operaciones ;;
          esac

      - name: Guardar cartera y bitácora
        if: ${{ github.event_name == 'schedule' || inputs.comando == 'ciclo' }}
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Estado $(date '+%d/%m %H:%M')"
          git pull --rebase
          git push
