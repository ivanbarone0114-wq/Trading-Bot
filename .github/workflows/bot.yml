name: Bot de trading (paper)

# Horarios en UTC (Argentina = UTC-3).
on:
  schedule:
    # Los ciclos cada 10 minutos los dispara el Worker de Cloudflare (es puntual; el cron de GitHub se atrasa
    # o saltea ejecuciones). Esta línea es un respaldo por hora por si el Worker fallara.
    - cron: "7 * * * *"
    # Resumen del día: 22:00 hora argentina, de lunes a viernes.
    - cron: "0 1 * * 2-6"
    # Reporte semanal + informe de análisis: domingos 20:00 hora argentina.
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      comando:
        description: "Qué ejecutar"
        type: choice
        options: [auto, ciclo, cripto, resumen, reporte, informe, panel, ccl, cotizacion, cartera]
        default: ciclo
      simbolo:
        description: "Símbolo para cotizacion (ej: GGAL.BA, NVDA, BTC) o días para informe (ej: 30)"
        required: false
        default: ""
      canal:
        description: "Canal de respuesta (vacío = todos; telegram = solo Telegram)"
        required: false
        default: ""

permissions:
  contents: write

# Lo que modifica archivos (ciclos, resumen, informe, panel) va en fila; las consultas corren aparte y no esperan.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && contains(fromJSON('["cotizacion","cartera","ccl"]'), inputs.comando)) && format('consulta-{0}', github.run_id) || 'trading-bot' }}
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Argentina/Buenos_Aires
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NOTIFY_CHANNELS: ${{ inputs.canal || vars.NOTIFY_CHANNELS || 'telegram,whatsapp' }}
      CMD_INPUT: ${{ inputs.comando }}
      SIMBOLO: ${{ inputs.simbolo }}
      EVENTO: ${{ github.event_name }}
      CRON: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot
        run: |
          CMD="$CMD_INPUT"
          if [ "$EVENTO" = "schedule" ]; then
            case "$CRON" in
              "0 1 * * 2-6") CMD=resumen ;;
              "0 23 * * 0")  CMD=reporte ;;
              "7 * * * *")   CMD=auto ;;
              *)             CMD=auto ;;
            esac
          fi
          echo "Comando: $CMD | Canales: $NOTIFY_CHANNELS"
          case "$CMD" in
            resumen)    python -m bot.main resumen-dia ;;
            reporte)    python -m bot.main reporte && python -m bot.main informe --dias 7 ;;
            informe)
              DIAS=$(echo "$SIMBOLO" | tr -cd '0-9'); DIAS=${DIAS:-7}
              python -m bot.main informe --dias "$DIAS" ;;
            ccl)        python -m bot.main ccl --enviar ;;
            cotizacion) python -m bot.main cotizacion "$SIMBOLO" ;;
            cartera)    python -m bot.main cartera ;;
            panel)      python -m bot.main panel ;;
            cripto)
              if [ "$EVENTO" = "schedule" ]; then
                python -m bot.main run --mode paper --solo-operaciones --mercados crypto
              else
                python -m bot.main run --mode paper --solo-operaciones --mercados crypto --confirmar
              fi ;;
            acciones)   python -m bot.main run --mode paper --solo-operaciones --mercados us,byma ;;
            auto)       python -m bot.main run --mode paper --solo-operaciones --mercados auto ;;
            *)          python -m bot.main run --mode paper --solo-operaciones --confirmar ;;
          esac

      - name: Guardar cartera y bitácora
        if: ${{ github.event_name == 'schedule' || !contains(fromJSON('["cotizacion","cartera","ccl"]'), inputs.comando) }}
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Estado $(date '+%d/%m %H:%M')"
          git pull --rebase -X theirs || (git rebase --abort; git pull --no-rebase -X ours --no-edit)
          git push
