name: Bot de trading (paper)

on:
  schedule:
    - cron: "17 * * * *"      # cada hora, en el minuto 17
  workflow_dispatch:
    inputs:
      comando:
        description: "Qué ejecutar"
        type: choice
        options: [ciclo, reporte, ccl]
        default: ciclo

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Argentina/Buenos_Aires
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot
        run: |
          case "${{ github.event.inputs.comando || 'ciclo' }}" in
            reporte) python -m bot.main reporte ;;
            ccl)     python -m bot.main ccl --enviar ;;
            *)       python -m bot.main run --mode paper --resumen ;;
          esac

      - name: Guardar cartera y bitácora
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Estado $(date '+%d/%m %H:%M')"
          git pull --rebase
          git push
