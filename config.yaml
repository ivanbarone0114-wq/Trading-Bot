# ============ CONFIGURACIÓN DEL BOT ============
mode: paper              # alerts | paper | live
state_dir: state         # cartera simulada, bitácora y alertas

capital:                 # capital asignado por mercado (en la moneda de cada mercado)
  crypto_d: 1000       # USDT, estrategia cripto diaria
  crypto_t: 1000       # USDT, estrategia cripto de tendencia
  crypto_f: 1000       # USDT, estrategia cripto Fibonacci
  crypto: 100           # USDT
  us: 1000              # USD
  byma: 1500000         # ARS (~1.000 USD al CCL)

watchlist:
  # --- Cripto (24 h): cada una se opera con las estrategias "tendencia" y "diario" ---
  - {symbol: BTC/USDT, market: crypto, timeframe: 1h, htf: 4h, keywords: [bitcoin, btc]}
  - {symbol: ETH/USDT, market: crypto, timeframe: 1h, htf: 4h, keywords: [ethereum]}
  - {symbol: SOL/USDT, market: crypto, timeframe: 1h, htf: 4h, keywords: [solana]}
  - {symbol: XRP/USDT, market: crypto, timeframe: 1h, htf: 4h, keywords: [xrp, ripple]}
  - {symbol: ADA/USDT, market: crypto, timeframe: 1h, htf: 4h, keywords: [cardano]}
  - {symbol: DOGE/USDT, market: crypto, timeframe: 1h, htf: 4h, keywords: [dogecoin]}
  - {symbol: LINK/USDT, market: crypto, timeframe: 1h, htf: 4h, keywords: [chainlink]}
  - {symbol: AVAX/USDT, market: crypto, timeframe: 1h, htf: 4h, keywords: [avalanche]}

  # --- BYMA (acciones locales, en ARS) ---
  - {symbol: GGAL,  market: byma, timeframe: 1d, htf: 1wk, keywords: [galicia, merval]}
  - {symbol: YPFD,  market: byma, timeframe: 1d, htf: 1wk, keywords: [ypf, merval]}
  - {symbol: PAMP,  market: byma, timeframe: 1d, htf: 1wk, keywords: [pampa energía]}
  - {symbol: BMA,   market: byma, timeframe: 1d, htf: 1wk, keywords: [banco macro]}
  - {symbol: TXAR,  market: byma, timeframe: 1d, htf: 1wk, keywords: [ternium argentina]}
  - {symbol: ALUA,  market: byma, timeframe: 1d, htf: 1wk, keywords: [aluar]}
  - {symbol: CEPU,  market: byma, timeframe: 1d, htf: 1wk, keywords: [central puerto]}
  - {symbol: TGSU2, market: byma, timeframe: 1d, htf: 1wk, keywords: [transportadora gas del sur]}

  # --- NYSE / EE.UU. (en USD) ---
  - {symbol: VIST, market: us, timeframe: 1d, htf: 1wk, keywords: [vista energy]}
  - {symbol: SPY,  market: us, timeframe: 1d, htf: 1wk, keywords: ["wall street", "s&p 500"]}
  - {symbol: NVDA, market: us, timeframe: 1d, htf: 1wk, keywords: [nvidia]}
  - {symbol: KO,   market: us, timeframe: 1d, htf: 1wk, keywords: [coca-cola]}
  - {symbol: JPM,  market: us, timeframe: 1d, htf: 1wk, keywords: [jpmorgan]}
  - {symbol: XOM,  market: us, timeframe: 1d, htf: 1wk, keywords: [exxon]}
  - {symbol: YPF,  market: us, timeframe: 1d, htf: 1wk, keywords: [ypf adr]}
  - {symbol: GGAL, market: us, timeframe: 1d, htf: 1wk, keywords: [galicia adr]}
  - {symbol: MELI, market: us, timeframe: 1d, htf: 1wk, keywords: [mercadolibre]}

strategy:
  ema_fast: 20
  ema_slow: 50
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  atr_stop_mult: 2.0     # stop = entrada - 2 x ATR
  reward_risk: 2.0       # objetivo = 2 x distancia al stop
  threshold: 0.35        # |score| mínimo para BUY/SELL
  weights: {trend: 2.0, macd: 1.5, rsi: 1.0, patterns: 1.0, news: 0.75}

risk:
  risk_per_trade: 0.04       # 4% del capital en riesgo por operación
  max_position_pct: 0.35     # máx. 35% del capital en un solo activo
  max_open_positions: 5
  max_daily_loss_pct: 0.03   # corta el día si pierde 3%
  fee: 0.006
  slippage: 0.0005

news:
  enabled: true
  move_alert_pct: 0.05    # aviso inmediato si una acción se mueve más de 5% en el día
  movers_top: 5           # cuántas subas y bajas mostrar
  digest_midday: "13:00"  # resumen de subas y bajas a media rueda (hora argentina)
  digest_close: "18:15"   # resumen al cierre
  max_items: 20

live:
  enabled: false         # doble llave: esto en true + flag --confirm-live
  auto_confirm: false    # false = pide confirmación por consola en cada orden
  crypto_testnet: true   # Binance testnet (dinero ficticio)
  alpaca_paper: true     # Alpaca paper (dinero ficticio)

ccl:
  enabled: true
  pairs:
    - {local: GGAL, adr: GGAL, ratio: 10}
    - {local: YPFD, adr: YPF,  ratio: 10}
universe:
  us: [AAPL, MSFT, AMZN, GOOGL, META, TSLA, AVGO, AMD, NFLX, V, MA, UNH, JNJ, PFE,
       CVX, PEP, WMT, COST, DIS, CAT, BA, GLOB, BMA, PAM, CEPU, TGS, LOMA, SUPV, BBAR, TEO]
  byma: [TGNO4, CRES, LOMA, EDN, SUPV, BBAR, TECO2, COME, BYMA, VALO, MIRG, TRAN]
# ============ CEDEARs ============
# Se usan para buscar desvíos contra el dólar CCL (posibles arbitrajes) y, si trade es true,
# también se analizan y operan en paper como BYMA (en pesos).
# ratio = cuántos CEDEARs equivalen a 1 acción. VERIFICAR en la tabla oficial: cambian con splits.
cedears:
  trade: true
  alert_pct: 0.03        # avisa si el CCL implícito se desvía más de 3% del de referencia
  list:
    - {symbol: AAPL,  ratio: 20}
    - {symbol: MSFT,  ratio: 30}
    - {symbol: GOOGL, ratio: 58}
    - {symbol: AMZN,  ratio: 144}
    - {symbol: META,  ratio: 24}
    - {symbol: NVDA,  ratio: 24}
    - {symbol: TSLA,  ratio: 15}
    - {symbol: KO,    ratio: 5}
    - {symbol: MELI,  ratio: 120}
    - {symbol: SPY,   ratio: 20}
    - {symbol: QQQ,   ratio: 20}
strategy_overrides:
  crypto:
    ema_fast: 12
    ema_slow: 26
    atr_stop_mult: 2.0
    reward_risk: 2.0
    threshold: 0.40

fees:
  crypto: 0.001
  crypto_d: 0.001
  crypto_t: 0.001
  crypto_f: 0.001
  us: 0.006
  byma: 0.006

# Monto mínimo por compra (evita posiciones "polvo" que ocupan cupos)
min_order:
  crypto: 20
  crypto_d: 20
  crypto_t: 20
  crypto_f: 20
  us: 20
  byma: 20000

# ============ CRIPTO: DOS ESTRATEGIAS EN PARALELO ============
# Cada cripto de la watchlist se analiza con las dos, cada una con su capital (capital.crypto_d / crypto_t).
crypto_strategies:
  tendencia:          # velas diarias; compra con precio y EMA20 sobre EMA50; vende cuando se pierde
    enabled: true
    ema_fast: 20
    ema_slow: 50
    stop_atr: 3.0     # stop de emergencia, en ATR diarios
    max_posiciones: 4 # cada posición es 1/4 del capital (más concentrado = más riesgo)
  diario:             # velas de 1 h; giro de MACD con tendencia diaria y de 4 h alcistas
    enabled: true
    reward_risk: 2.0  # objetivo = 2 veces la distancia al stop
    max_hold_h: 24    # cierre forzado a las 24 h
  fibonacci:          # velas de 4 h; compra el rebote en la zona 50%-78,6% de un impulso alcista
    enabled: true
    pivote: 3         # velas a cada lado para marcar máximos y mínimos
    impulso_atr: 3.0  # tamaño mínimo del impulso, en ATR
    max_velas: 60     # cierre forzado a las 60 velas de 4 h (10 días)

# ============ CALENDARIO (pestaña Terminal) ============
# Eventos propios que querés ver en el calendario. Las reuniones de la Fed y los balances se cargan solos.
# Ejemplo:
#   - {fecha: 2026-11-13, evento: "INDEC publica la inflación de octubre"}
calendario: []

# ============ MÁS RIESGO ============
# Riesgo propio de cada mercado (sobrescribe la sección risk).
risk_overrides:
  crypto_d: {risk_per_trade: 0.05, max_position_pct: 0.5, max_open_positions: 4}
  crypto_f: {risk_per_trade: 0.05, max_position_pct: 0.5, max_open_positions: 4}

# Escala del capital: la cartera existente se multiplica una sola vez por este factor
# (100 → 1.000). No cambia los porcentajes; solo hace los montos más fáciles de leer.
escala:
  factor: 10

# ============ RENTA FIJA (pestaña Terminal) ============
# Para ver la tasa de una Lecap, cargá lo que paga al vencimiento (cada 100 de valor nominal).
# Ejemplo:  S30N6: 132.5
renta_fija:
  pagos: {}
